<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2">
<title>Lead Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm calling desk — big targets, plain words, one colour per status
   IDEA: the Figma "Lead Desk" file, built 1:1 — soft white cards on cool grey, lime for "selected"
   PICTURE: the lead cards and the three filter tiles at the top
   COLOUR and TYPE: grey #EDEFF2, white cards, ink #111114, lime #D7F36B; Plus Jakarta Sans
   LAYOUT: one phone column (max 480px), floating dark tab bar, full-screen detail page, bottom sheet after calls */
:root{color-scheme:light;--bg:#EDEFF2;--card:#fff;--ink:#111114;--mute:#868A94;--line:#E4E6EA;--soft:#F3F4F6;--lime:#D7F36B;--pink:#F8DCE5;--lav:#E4E0FA;--wa:#1FAF55;--r:24px}
*{box-sizing:border-box;min-width:0;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
.app{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.view[hidden]{display:none}
.hd{display:flex;align-items:center;gap:8px;padding:6px 0 14px}
.hd .grow{flex:1}
.lbl-s{font-size:12.5px;font-weight:600;color:var(--mute)}
.client{position:relative;display:inline-flex;align-items:center;gap:6px}
.client select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:28px;font-weight:800;letter-spacing:-.02em;padding-right:26px;outline:none;max-width:72vw;text-overflow:ellipsis;cursor:pointer}
.client svg{position:absolute;right:0;width:20px;height:20px;pointer-events:none}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.circle{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.circle svg{width:19px;height:19px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:100px}
.tile .ic{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tile .ic svg{width:17px;height:17px}
.tile b{font-size:26px;font-weight:800;line-height:1.1}
.tile span{font-size:13px;font-weight:700;line-height:1.3}
.tile.on{background:var(--lime)}.tile.on .ic{background:var(--card)}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--card);padding:0 16px;margin-top:14px}
.search svg{width:18px;height:18px;color:var(--mute)}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:16px;font-weight:500}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;font-weight:500;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff}.chip.on em{color:var(--lime)}
.ltitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}
.ltitle h2{font-size:18px;font-weight:700}
.ltitle p{font-size:12.5px;font-weight:600;color:var(--mute)}
.next{display:flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 13px;border-radius:99px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap}
.next svg{width:15px;height:15px;color:var(--lime)}
.demo{background:var(--card);border-radius:16px;padding:10px 14px;font-size:12.5px;color:var(--mute);margin-bottom:12px}
/* card */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.ctop{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;background:var(--lav)}
.who{flex:1}
.nm{font-size:16.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{display:block;font-size:12.5px;font-weight:500;color:var(--mute);margin-top:2px}
.dt svg{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.det{display:flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 12px;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:700;flex:none}
.det svg{width:16px;height:16px}
.ph{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.info{display:flex;gap:8px;flex-wrap:wrap}
.info span{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600}
.info svg{width:14px;height:14px;color:var(--mute)}
.meta{font-size:12.5px;font-weight:600;color:var(--mute);margin-top:-6px}
.meta .due{color:#C2410C}
.lastnote{font-size:13px;color:var(--mute);margin-top:-8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.stwrap{display:flex;flex-direction:column;gap:6px}
.ssel{appearance:none;-webkit-appearance:none;width:100%;height:44px;border:0;border-radius:99px;padding:0 40px 0 30px;font-size:14px;font-weight:700;outline:none;cursor:pointer;
  background-repeat:no-repeat;background-position:14px 50%,calc(100% - 16px) 50%;background-size:8px 8px,16px 16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;font-size:15px;font-weight:700}
.btn svg{width:17px;height:17px}
.call{background:var(--ink);color:#fff}
.wa{background:var(--wa);color:#fff}
.nophone{grid-column:1/-1;text-align:center;color:var(--mute);font-size:13px;padding:12px;background:var(--soft);border-radius:24px}
.empty{background:var(--card);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.group{font-size:13px;font-weight:700;color:var(--mute);margin:18px 4px 10px}
.group:first-child{margin-top:4px}
/* stats */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border-radius:99px;padding:4px}
.seg button{height:40px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.hero{position:relative;overflow:hidden;background:var(--lime);border-radius:28px;padding:20px;margin-top:14px}
.hero span{font-size:14px;font-weight:600}
.hero b{display:block;font-size:52px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hero p{font-size:13.5px;font-weight:500;position:relative}
.hero i{position:absolute;border:1.5px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.st{border-radius:22px;padding:16px;background:var(--card)}
.st span{font-size:13px;font-weight:600}
.st b{display:block;font-size:32px;font-weight:800;line-height:1.25}
.st small{font-size:12.5px;font-weight:500;color:var(--mute)}
.box{background:var(--card);border-radius:var(--r);padding:18px;margin-top:10px}
.box h3{font-size:16px;font-weight:700;margin-bottom:8px}
.bar{display:grid;grid-template-columns:104px minmax(0,1fr) 24px;gap:10px;align-items:center;font-size:13px;font-weight:600;padding:5px 0}
.bar i{display:block;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i em{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar b{text-align:right}
.speed{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:22px;padding:16px 18px;margin-top:10px}
.speed .ic{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex:none}
.speed .ic svg{width:19px;height:19px}
.speed div{flex:1}
.speed span{font-size:12.5px;font-weight:600}
.speed b{display:block;font-size:20px;font-weight:800;color:var(--lime)}
.speed small{font-size:12px;font-weight:600;opacity:.6;text-align:right;max-width:90px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--mute);text-align:right;padding:6px 0 6px 8px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:10px 0 10px 8px;border-bottom:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
tr:last-child td{border:0}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));height:64px;padding:6px;border-radius:99px;background:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;z-index:10;box-shadow:0 10px 30px rgba(17,17,20,.18)}
.nav button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:99px;color:rgba(255,255,255,.7);font-size:13.5px;font-weight:700}
.nav button svg{width:18px;height:18px}
.nav button.on{background:var(--lime);color:var(--ink)}
.nav sup{position:absolute;top:6px;left:calc(50% - 44px);background:#D63A2B;color:#fff;font-size:10px;font-weight:800;line-height:16px;min-width:16px;text-align:center;border-radius:99px;padding:0 4px}
.fade{position:fixed;left:0;right:0;bottom:0;height:110px;background:linear-gradient(rgba(237,239,242,0),var(--bg) 60%);pointer-events:none;z-index:9}
/* detail page */
.page{position:fixed;inset:0;background:var(--bg);z-index:15;overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.page.on{transform:none;visibility:visible}
.page .in{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.tbar{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.tbar h1{font-size:16px;font-weight:700}
.prof{display:flex;align-items:center;gap:14px;padding-top:4px}
.prof .av{width:64px;height:64px;font-size:22px;font-weight:800}
.prof h2{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.pc{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pc .big{font-size:26px;font-weight:800;letter-spacing:-.01em}
.pc .btn{height:56px;border-radius:28px;font-size:16px}
.sc{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sc .ssel{height:48px}
.fu{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:12px 14px;position:relative}
.fu svg{width:18px;height:18px;color:#7C5CF0}
.fu div{flex:1}
.fu small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.fu strong{font-size:14.5px;font-weight:700}
.fu em{font-style:normal;font-size:13px;font-weight:700;color:#7C5CF0}
.fu input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.itiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.itile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.itile .ic{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.itile .ic svg{width:17px;height:17px}
.itile span{font-size:12.5px;font-weight:600}
.itile b{display:block;font-size:18px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;gap:12px;background:var(--card);border-radius:18px;padding:13px 16px;font-size:13.5px}
.row span{color:var(--mute);font-weight:600;flex:none}
.row b{font-weight:700;text-align:right;overflow-wrap:anywhere}
.notes{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.notes .nh{display:flex;justify-content:space-between;align-items:center}
.notes h3{font-size:16px;font-weight:700}
.pill-lime{display:flex;align-items:center;gap:6px;background:var(--lime);border-radius:99px;padding:8px 14px 8px 12px;font-size:13px;font-weight:700}
.pill-lime svg{width:15px;height:15px}
.note{display:flex;gap:12px}
.note i{width:10px;height:10px;border-radius:50%;background:var(--ink);margin-top:5px;flex:none}
.note small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.note p{font-size:14px;font-weight:500;white-space:pre-wrap}
.answers{background:var(--card);border-radius:26px;padding:6px 18px}
.answers h3{font-size:16px;font-weight:700;padding:12px 0 6px}
.ans{display:grid;grid-template-columns:minmax(0,45%) minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.ans span{color:var(--mute);font-weight:600}
.ans b{font-weight:600;overflow-wrap:anywhere}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(17,17,20,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;gap:16px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.ended{display:inline-flex;align-items:center;gap:6px;background:#DCF4EA;color:#0E9567;border-radius:99px;padding:4px 10px 4px 8px;font-size:12px;font-weight:700}
.ended svg{width:12px;height:12px}
.sheet h2{font-size:23px;font-weight:800;line-height:1.3;margin-top:4px}
.sheet .sub{font-size:13.5px;font-weight:500;color:var(--mute)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:9px;height:50px;padding:0 12px 0 14px;border-radius:16px;border:1.5px solid var(--line);font-size:14px;font-weight:700;text-align:left}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.opt span{flex:1}
.opt svg{width:16px;height:16px;display:none}
.opt.on{border:2px solid var(--c);background:var(--t);color:var(--c)}
.opt.on svg{display:block}
.slbl{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:8px}
.qd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qd button{height:40px;padding:0 14px;border-radius:99px;background:var(--soft);font-size:13.5px;font-weight:700}
.qd button.on{background:var(--ink);color:#fff}
.qd .cal{position:relative;width:40px;padding:0;display:grid;place-items:center}
.qd .cal svg{width:17px;height:17px}
.qd .cal input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.qd .when{font-size:13px;font-weight:600;color:var(--mute)}
.nbox{display:flex;gap:10px;align-items:flex-end;background:var(--soft);border-radius:18px;padding:12px 10px 10px 16px}
.nbox textarea{flex:1;border:0;background:transparent;outline:none;resize:none;font-size:16px;font-weight:500;min-height:64px;line-height:1.4}
.nbox textarea::placeholder{color:var(--mute)}
.mic{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none}
.mic svg{width:19px;height:19px}
.mic.rec{background:#D63A2B;color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.save{height:56px;border-radius:28px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;flex:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.page,.sheet,.ov,.toast{transition:none}.spin svg,.mic.rec{animation:none}}
@media (max-width:370px){.tile{padding:12px}.tile b{font-size:22px}.tile span{font-size:12px}.bar{grid-template-columns:88px minmax(0,1fr) 22px}}
</style>
</head>
<body>
<div class="app">
  <!-- LEADS -->
  <section class="view" id="vLeads">
    <div class="hd">
      <div class="grow"><div class="lbl-s">Client</div><label class="client"><select id="client" aria-label="Client"></select><span data-i="chevD"></span></label></div>
      <button class="circle" id="refresh" aria-label="Refresh leads"><span data-i="refresh"></span></button>
    </div>
    <div class="demo" id="demo" hidden>Demo with sample leads. Connect your Google Sheet to see real ones.</div>
    <div class="tiles" id="tiles"></div>
    <label class="search"><span data-i="search"></span><input id="q" type="search" placeholder="Search name, phone, city" autocomplete="off"></label>
    <div class="chips" id="chips"></div>
    <div class="ltitle"><div><h2 id="lt"></h2><p id="ls"></p></div><a class="next" id="next" hidden><span data-i="phone"></span>Call next</a></div>
    <div class="list" id="list"></div>
  </section>
  <!-- FOLLOW-UPS -->
  <section class="view" id="vFollow" hidden>
    <div class="hd"><div class="grow h1">Follow-ups</div></div>
    <div id="flist"></div>
  </section>
  <!-- STATS -->
  <section class="view" id="vStats" hidden>
    <div class="hd"><div class="grow h1">Stats</div></div>
    <div class="seg" id="seg"><button data-p="today">Today</button><button data-p="week">This week</button><button data-p="all" class="on">All time</button></div>
    <div id="stats"></div>
  </section>
</div>
<div class="fade"></div>
<nav class="nav" id="nav">
  <button data-v="vLeads" class="on"><span data-i="list"></span>Leads</button>
  <button data-v="vFollow"><span data-i="cal"></span>Follow-ups<sup id="dueBadge" hidden></sup></button>
  <button data-v="vStats"><span data-i="chart"></span>Stats</button>
</nav>
<div class="page" id="page"><div class="in" id="pageIn"></div></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
{
/* ================= SETTINGS ================= */
const COUNTRY_CODE = '91';   // added when a number has no country code ('971' for UAE)
const WA_TEXT = 'Hi {name}, thanks for your interest in Ibna apartments for rent. You mentioned you are looking for a {type} apartment in {city}. Is this a good time to talk?';
const STATUSES = [
  { k: 'New',            c: '#3B6FF2', t: '#E4ECFF' },
  { k: 'No answer',      c: '#B57C00', t: '#FFF2CC' },
  { k: 'Follow-up',      c: '#7C5CF0', t: '#EEE8FF' },
  { k: 'Interested',     c: '#0E9567', t: '#DCF4EA' },
  { k: 'Visit booked',   c: '#0A84A6', t: '#DAF1F7' },
  { k: 'Rented',         c: '#1E6B2E', t: '#D7F36B' },
  { k: 'Not interested', c: '#6F737C', t: '#ECEDF0' },
  { k: 'Wrong number',   c: '#D63A2B', t: '#FDE3E0' }
];
/* ============================================ */

const SYS = ['Status', 'Notes', 'Follow Up', 'Attempts', 'Last Called', 'First Called'];
const HIDE = /(^id$|_id$|^ad_?name$|^adset_?name$|^form_?name$|^is_organic$|^platform$|^lead_?status$|^inbox_url$)/i;
const CLOSED = ['Rented', 'Not interested', 'Wrong number'];
const NOTCONN = ['New', 'No answer'];
const WARM = ['Interested', 'Visit booked'];
const REACHED = ['Follow-up', 'Interested', 'Visit booked', 'Rented', 'Not interested'];

  refresh: sv('<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>'), check: sv('<path d="M20 6 9 17l-5-5"/>'),

  missed: sv('<path d="m16 2 6 6M22 2l-6 6"/><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'),

};
document.querySelectorAll('[data-i]').forEach(e => e.outerHTML = IC[e.dataset.i]);

const S = { clients: [], client: '', leads: [], view: 'vLeads', filter: 'today', q: '', period: 'all', pending: null, sheet: null, detail: null };
let COLS = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const label = k => String(k).replace(/_/g, ' ').replace(/\s+/g, ' ').trim().replace(/^\w/, c => c.toUpperCase());
const nice = v => String(v || '').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const lsGet = k => { try { return localStorage.getItem('ld_' + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('ld_' + k, v); } catch (e) {} };

/* ---------- columns (Meta's headers work automatically) ---------- */
function detect(h) {
  const f = re => h.find(x => re.test(x)) || null;
  return {
    id: f(/^id$/i) || f(/^lead_?id$/i),
    name: f(/^full.?name$/i) || f(/^name$/i) || f(/name/i),
    phone: f(/phone|mobile|whats|contact.?n/i),
    campaign: f(/campaign.?name/i) || f(/^campaign$/i),
    time: f(/created.?time/i) || f(/^date|timestamp|submitted|time/i),
    city: f(/city/i) || f(/location|area/i),
    type: f(/furnish/i) || f(/apartment.?type|prefer|looking.?for/i)
  };
}
const F = (l, k) => COLS[k] ? (l.d[COLS[k]] || '') : '';
const nameOf = l => F(l, 'name') || 'No name';
const statusOf = l => l.d.Status || 'New';
const sm = s => SM[s] || { k: s, c: '#6F737C', t: '#ECEDF0' };
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const avBg = l => AVS[l.row % AVS.length];

function cleanPhone(p) {
  if (!p) return '';
  p = String(p).replace(/^p:/i, '').trim();
  const plus = p.startsWith('+'); let d = p.replace(/\D/g, '');
  if (!plus) {
    if (d.startsWith('00')) d = d.slice(2);
    else if (d.length === 11 && d.startsWith('0')) d = COUNTRY_CODE + d.slice(1);
    else if (d.length <= 10) d = COUNTRY_CODE + d;
  }
  return d.length >= 8 ? d : '';
}
function fmtPhone(d) {
  if (!d) return '';
  if (d.startsWith('91') && d.length === 12) return `+91 ${d.slice(2, 7)} ${d.slice(7)}`;
  if (d.startsWith('971') && d.length === 12) return `+971 ${d.slice(3, 5)} ${d.slice(5, 8)} ${d.slice(8)}`;
  return '+' + d;
}
function waLink(l, ph) {
  const t = WA_TEXT.replace('{name}', nameOf(l).split(' ')[0])
    .replace('{type}', nice(F(l, 'type')).toLowerCase() || 'rental')
    .replace(' in {city}', F(l, 'city') ? ' in ' + F(l, 'city') : '').replace('{city}', F(l, 'city'));
  return `https:\/\/wa.me/${ph}?text=${encodeURIComponent(t)}`;
}

/* ---------- dates ---------- */
const pd = s => { if (!s) return null; const d = new Date(String(s).trim().replace(/([+-]\d\d)(\d\d)$/, '$1:$2').replace(/^(\d{4}-\d\d-\d\d) /, '$1T')); return isNaN(d) ? null : d; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const stamp = () => new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function ago(s) {
  const d = pd(s); if (!d) return '';
  const m = (Date.now() - d) / 60000;
  if (m < 1) return 'just now'; if (m < 60) return Math.floor(m) + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  return Math.floor(m / 1440) + 'd ago';
}
function fmtDT(s) {
  const d = pd(s); if (!d) return s || '';
  const o = { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleString('en-IN', o);
}
const whenTxt = s => { const t = F(s, 'time'); const a = ago(t); return fmtDT(t) + (a ? ' · ' + a : ''); };
function fmtDay(s) {
  if (!s) return ''; if (s === today()) return 'Today'; if (s === addDays(1)) return 'Tomorrow';
  const d = pd(s + 'T00:00'); return d ? d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) : s;
}
const isToday = l => { const d = pd(F(l, 'time')); return !!d && ymd(d) === today(); };
const isDue = l => { const f = l.d['Follow Up']; return !!f && f <= today() && !CLOSED.includes(statusOf(l)); };

/* ---------- views / filters ---------- */
const TILES = [
  { k: 'today', t: 'Today’s leads', ic: 'sun', f: isToday, sub: n => `${n} lead${n === 1 ? '' : 's'} · newest first` },
  { k: 'notconn', t: 'Not connected', ic: 'missed', f: l => NOTCONN.includes(statusOf(l)), sub: n => `${n} · new or no answer` },
  { k: 'warm', t: 'Interested', ic: 'flame', f: l => WARM.includes(statusOf(l)), sub: n => `${n} · interested or visit booked` }
];
const CHIPS = [
  { k: 'all', t: 'All leads', f: () => true, sub: n => `${n} leads · newest first` },
  { k: 'due', t: 'Follow-up due', c: '#7C5CF0', f: isDue, sub: n => `${n} · due today or earlier` },
  ...['Visit booked', 'Rented', 'Not interested', 'Wrong number', 'Follow-up'].map(s => ({ k: s, t: s, c: SM[s].c, f: l => statusOf(l) === s, sub: n => `${n} lead${n === 1 ? '' : 's'}` }))
];
const VIEW = k => TILES.find(x => x.k === k) || CHIPS.find(x => x.k === k);

/* ---------- API ---------- */
function api(fn, ...a) {
  return new Promise((res, rej) => {
    if (!LIVE) { try { res(DEMO[fn](...a)); } catch (e) { rej(e); } return; }
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a);
  });
}
async function init() {
  if (!LIVE) $('#demo').hidden = false;
  try {
    S.clients = await api('getClients');
    const saved = lsGet('client'); S.client = S.clients.includes(saved) ? saved : S.clients[0];
    $('#client').innerHTML = S.clients.map(c => `<option${c === S.client ? ' selected' : ''}>${esc(c)}</option>`).join('');
    await load();
  } catch (e) { $('#list').innerHTML = `<div class="empty"><b>Couldn’t load leads</b>${esc(e.message || e)}</div>`; }
}
async function load(silent) {
  if (!S.client) { $('#list').innerHTML = '<div class="empty"><b>No client tabs</b>Add a tab to your sheet.</div>'; return; }
  if (!silent) $('#list').innerHTML = '<div class="empty">Loading leads…</div>';
  $('#refresh').classList.add('spin');
  try {
    const r = await api('getLeads', S.client);
    COLS = detect(r.headers);
    S.leads = r.leads.slice().sort((a, b) => (pd(F(b, 'time')) || b.row) - (pd(F(a, 'time')) || a.row));
    if (!silent && S.filter === 'today' && !S.leads.some(isToday)) S.filter = S.leads.some(TILES[1].f) ? 'notconn' : 'all';
    render();
    if (S.detail != null) renderDetail();
  } catch (e) { if (!silent) $('#list').innerHTML = `<div class="empty"><b>Couldn’t load leads</b>${esc(e.message || e)}</div>`; }
  $('#refresh').classList.remove('spin');
}

/* ---------- render: leads ---------- */
function render() {
  const due = S.leads.filter(isDue).length;
  $('#dueBadge').hidden = !due; $('#dueBadge').textContent = due;
  if (S.view === 'vLeads') renderLeads();
  if (S.view === 'vFollow') renderFollow();
  if (S.view === 'vStats') renderStats();
}
function renderLeads() {
  $('#tiles').innerHTML = TILES.map(t => `<button class="tile${S.filter === t.k ? ' on' : ''}" data-f="${t.k}"><span class="ic">${IC[t.ic]}</span><b>${S.leads.filter(t.f).length}</b><span>${t.t}</span></button>`).join('');
  $('#chips').innerHTML = CHIPS.map(c => `<button class="chip${S.filter === c.k ? ' on' : ''}" data-f="${esc(c.k)}">${c.c ? `<i style="--c:${c.c}"></i>` : ''}${esc(c.t)} <em>${S.leads.filter(c.f).length}</em></button>`).join('');
  const v = VIEW(S.filter); const q = S.q.toLowerCase();
  let ls = S.leads.filter(v.f);
  const n = ls.length;
  if (q) ls = S.leads.filter(l => Object.values(l.d).join(' ').toLowerCase().includes(q));
  $('#lt').textContent = q ? 'Search results' : v.t;
  $('#ls').textContent = q ? `${ls.length} found in all leads` : v.sub(n);
  const nx = ls.find(l => NOTCONN.includes(statusOf(l)) && cleanPhone(F(l, 'phone')));
  const nb = $('#next'); nb.hidden = !nx;
  if (nx) { nb.href = 'tel:+' + cleanPhone(F(nx, 'phone')); nb.dataset.call = nx.row; nb.setAttribute('aria-label', 'Call next: ' + nameOf(nx)); }
  $('#list').innerHTML = ls.length ? ls.map(card).join('') : emptyFor(S.filter, q);
}
function emptyFor(k, q) {
  if (q) return '<div class="empty"><b>No match</b>Try a name, number or city.</div>';
  if (k === 'today') return '<div class="empty"><b>No new leads today yet</b>Check “Not connected” for people still waiting for a call.</div>';
  if (k === 'notconn') return '<div class="empty"><b>Everyone has been reached 🎉</b>No new or unanswered leads.</div>';
  return '<div class="empty"><b>Nothing here</b>No leads in this list right now.</div>';
}
function statusSelect(l, big) {
  const st = statusOf(l), s = sm(st), opts = STATUSES.map(x => x.k); if (!opts.includes(st)) opts.unshift(st);
  const dot = `url(&quot;data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http:\/\/www.w3.org/2000/svg' viewBox='0 0 8 8'><circle cx='4' cy='4' r='4' fill='${s.c}'/></svg>`)}&quot;)`;
  const chev = `url(&quot;data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http:\/\/www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='${s.c}' stroke-width='2.4' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>`)}&quot;)`;
  return `<select class="ssel" data-st="${l.row}" aria-label="Status" style="color:${s.c};background-color:${s.t};background-image:${dot},${chev}">${opts.map(k => `<option${k === st ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select>`;
}
function actions(l) {
  const ph = cleanPhone(F(l, 'phone'));
  return ph ? `<a class="btn call" href="tel:+${ph}" data-call="${l.row}">${IC.phone}Call</a><a class="btn wa" href="${esc(waLink(l, ph))}" target="_blank" rel="noopener" data-wa="${l.row}">${IC.msg}WhatsApp</a>`
            : '<div class="nophone">No phone number on this lead</div>';
}
function card(l) {
  const ph = cleanPhone(F(l, 'phone')), st = statusOf(l), fu = l.d['Follow Up'], att = +l.d.Attempts || 0;
  const info = [['pin', F(l, 'city')], ['sofa', nice(F(l, 'type'))]].filter(x => x[1]);
  const meta = [att ? `${att} call${att > 1 ? 's' : ''}` : '', fu && !CLOSED.includes(st) ? `<span class="${isDue(l) ? 'due' : ''}">Follow up ${esc(fmtDay(fu))}</span>` : ''].filter(Boolean).join(' · ');
  const last = (l.d.Notes || '').split('\n')[0];
  return `<article class="card" data-row="${l.row}">
    <div class="ctop"><div class="av" style="background:${avBg(l)}">${esc(initials(nameOf(l)))}</div>
      <div class="who"><div class="nm">${esc(nameOf(l))}</div><div class="dt">${IC.clock}${esc(whenTxt(l))}</div></div>
      <button class="det" data-open="${l.row}">Details${IC.chevR}</button></div>
    <div class="ph">${ph ? esc(fmtPhone(ph)) : 'No phone number'}</div>
    ${info.length ? `<div class="info">${info.map(([i, v]) => `<span>${IC[i]}${esc(v)}</span>`).join('')}</div>` : ''}
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    ${last ? `<div class="lastnote">${esc(last)}</div>` : ''}
    <div class="stwrap"><span class="lbl-s">Status</span>${statusSelect(l)}</div>
    <div class="acts">${actions(l)}</div>
  </article>`;
}

/* ---------- render: follow-ups ---------- */
function renderFollow() {
  const ls = S.leads.filter(l => l.d['Follow Up'] && !CLOSED.includes(statusOf(l))).sort((a, b) => a.d['Follow Up'].localeCompare(b.d['Follow Up']));
  const t = today(), tm = addDays(1), wk = addDays(7);
  const groups = [['Overdue', l => l.d['Follow Up'] < t], ['Today', l => l.d['Follow Up'] === t], ['Tomorrow', l => l.d['Follow Up'] === tm], ['This week', l => l.d['Follow Up'] > tm && l.d['Follow Up'] <= wk], ['Later', l => l.d['Follow Up'] > wk]];
  const html = groups.map(([g, f]) => { const x = ls.filter(f); return x.length ? `<div class="group">${g} · ${x.length}</div><div class="list">${x.map(card).join('')}</div>` : ''; }).join('');
  $('#flist').innerHTML = html || '<div class="empty"><b>No follow-ups set</b>After a call, pick a follow-up date and it shows up here.</div>';
}

/* ---------- render: stats ---------- */
function renderStats() {
  const now = new Date(), wkAgo = new Date(now - 7 * 864e5);
  const ls = S.leads.filter(l => { if (S.period === 'all') return true; const d = pd(F(l, 'time')); if (!d) return false; return S.period === 'today' ? ymd(d) === today() : d >= wkAgo; });
  const tot = ls.length, n = k => ls.filter(l => statusOf(l) === k).length, pct = x => tot ? Math.round(x / tot * 100) + '%' : '0%';
  const reached = ls.filter(l => REACHED.includes(statusOf(l))).length;
  const max = Math.max(1, ...STATUSES.map(s => n(s.k)));
  const sp = ls.map(l => { const a = pd(F(l, 'time')), b = pd(l.d['First Called']); return a && b && b > a ? (b - a) / 60000 : null; }).filter(x => x != null);
  const avg = sp.length ? sp.reduce((a, b) => a + b, 0) / sp.length : null;
  const fmtM = m => m < 60 ? Math.round(m) + ' min' : m < 1440 ? (m / 60).toFixed(1).replace('.0', '') + ' hr' : (m / 1440).toFixed(1).replace('.0', '') + ' days';
  const camps = [...new Set(ls.map(l => F(l, 'campaign') || 'No campaign'))];
  $('#stats').innerHTML = `
  <div class="hero"><i style="width:160px;height:160px;right:-40px;top:-30px"></i><i style="width:240px;height:240px;right:-80px;top:-70px;opacity:.75"></i><i style="width:320px;height:320px;right:-120px;top:-110px;opacity:.5"></i>
    <span>Reached</span><b>${pct(reached)}</b><p>${reached} of ${tot} leads picked up the call</p></div>
  <div class="grid2">
    <div class="st" style="background:var(--pink)"><span>Not called yet</span><b>${n('New')}</b><small>${pct(n('New'))} of leads</small></div>
    <div class="st" style="background:#DCF4EA"><span>Interested</span><b>${n('Interested')}</b><small>Waiting for a visit</small></div>
    <div class="st" style="background:var(--lav)"><span>Visits booked</span><b>${n('Visit booked')}</b><small>Ready to show the flat</small></div>
    <div class="st"><span>Rented</span><b>${n('Rented')}</b><small>${pct(n('Rented'))} of leads</small></div>
  </div>
  <div class="box"><h3>By status</h3>${STATUSES.map(s => `<div class="bar" style="--c:${s.c}"><span>${s.k}</span><i><em style="width:${n(s.k) / max * 100}%"></em></i><b>${n(s.k)}</b></div>`).join('')}</div>
  <div class="speed"><span class="ic">${IC.clock}</span><div><span>Avg. time to first call</span><b>${avg == null ? '—' : fmtM(avg)}</b></div><small>Aim for under 5 min</small></div>
  ${camps.length > 1 ? `<div class="box"><h3>By campaign</h3><table><thead><tr><th>Campaign</th><th>Leads</th><th>Reached</th><th>Rented</th></tr></thead><tbody>${camps.map(c => { const x = ls.filter(l => (F(l, 'campaign') || 'No campaign') === c); return `<tr><td>${esc(c)}</td><td>${x.length}</td><td>${Math.round(x.filter(l => REACHED.includes(statusOf(l))).length / x.length * 100)}%</td><td>${x.filter(l => statusOf(l) === 'Rented').length}</td></tr>`; }).join('')}</tbody></table></div>` : ''}`;
}

  <div class="itiles">
    <div class="itile" style="background:var(--pink)"><span class="ic">${IC.pin}</span><div><span>City</span><b>${esc(F(l, 'city') || '—')}</b></div></div>
    <div class="itile" style="background:var(--lav)"><span class="ic">${IC.sofa}</span><div><span>Looking for</span><b>${esc(nice(F(l, 'type')) || '—')}</b></div></div>
  </div>
  ${F(l, 'campaign') ? `<div class="row"><span>Campaign</span><b>${esc(F(l, 'campaign'))}</b></div>` : ''}
  <div class="notes"><div class="nh"><h3>Call notes</h3><button class="pill-lime" data-note="${l.row}">${IC.mic}Add note</button></div>
    ${notes.length ? notes.map(([m, t]) => `<div class="note"><i></i><div><small>${esc(m)}</small><p>${esc(t)}</p></div></div>`).join('') : '<p class="lbl-s">No notes yet. Notes you add after a call show up here.</p>'}
    ${+l.d.Attempts ? `<p class="lbl-s">${l.d.Attempts} call${+l.d.Attempts > 1 ? 's' : ''}${l.d['Last Called'] ? ' · last ' + esc(l.d['Last Called']) : ''}</p>` : ''}</div>
  ${ans.length ? `<div class="answers"><h3>Form answers</h3>${ans.map(k => `<div class="ans"><span>${esc(label(k))}</span><b>${esc(nice(l.d[k]))}</b></div>`).join('')}</div>` : ''}`;
}

/* ---------- sheet: after call / add note ---------- */
function openSheet(row, mode, secs) {
  const l = S.leads.find(x => x.row === row); if (!l) return;
  const cur = statusOf(l);
  S.sheet = { row, mode, status: mode === 'call' && cur === 'New' ? '' : cur, fu: l.d['Follow Up'] || '' };
  const ph = cleanPhone(F(l, 'phone'));
  const dur = secs > 4 ? ` · ${Math.floor(secs / 60) ? Math.floor(secs / 60) + 'm ' : ''}${Math.round(secs % 60)}s` : '';
  $('#sheet').innerHTML = `<div class="grab"></div>
  <div>${mode === 'call' ? `<span class="ended">${IC.phone}Call ended${dur}</span>` : ''}
    <h2>${mode === 'call' ? 'How did the call go?' : 'Update this lead'}</h2>
    <div class="sub">${esc(nameOf(l))}${ph ? ' · ' + esc(fmtPhone(ph)) : ''}</div></div>
  <div class="sgrid">${STATUSES.map(s => `<button class="opt${s.k === S.sheet.status ? ' on' : ''}" data-s="${s.k}" style="--c:${s.c};--t:${s.t}"><i></i><span>${s.k}</span>${IC.check}</button>`).join('')}</div>
  <div><div class="slbl">Follow up on</div><div class="qd" id="qd"></div></div>
  <div><div class="slbl">Note</div><div class="nbox"><textarea id="note" rows="3" placeholder="Type a note, or tap the mic and speak"></textarea><button class="mic" id="mic" aria-label="Speak a note">${IC.mic}</button></div></div>
  <button class="save" id="save">Save</button>`;
  renderQD();
  $('#ov').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop = 0;
}
function renderQD() {
  const f = S.sheet.fu, q = [['Tomorrow', addDays(1)], ['In 3 days', addDays(3)], ['Next week', addDays(7)]];
  const custom = f && !q.some(x => x[1] === f);
  $('#qd').innerHTML = q.map(([t, d]) => `<button data-d="${d}" class="${f === d ? 'on' : ''}">${t}</button>`).join('') +
    `<label class="qd-l"><button class="cal${custom ? ' on' : ''}" type="button" tabindex="-1">${IC.cal}<input type="date" id="fuPick" value="${esc(f)}" aria-label="Pick a date"></button></label>` +
    (f ? `<span class="when">${esc(fmtDay(f))} · <button data-d="" style="height:auto;padding:0;background:none;font-size:13px;color:#D63A2B">clear</button></span>` : '');
}
function closeSheet() { S.sheet = null; stopMic(); $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }

async function saveLead(row, up, toastMsg) {
  const l = S.leads.find(x => x.row === row); if (!l) return;
  const prev = { ...l.d };
  Object.assign(l.d, up); render(); if (S.detail === row) renderDetail(); toast(toastMsg || 'Saved');
  try { await api('updateLead', S.client, row, up, COLS.id || '', COLS.id ? l.d[COLS.id] : ''); }
  catch (e) { l.d = prev; render(); if (S.detail === row) renderDetail(); toast('Not saved. Check your connection'); }
}
function saveSheet() {
  const o = S.sheet, l = S.leads.find(x => x.row === o.row); if (!l) return;
  if (!o.status) { toast('Pick how the call went'); return; }
  const up = { Status: o.status, 'Follow Up': o.fu };
  if (o.status === 'Follow-up' && !o.fu) up['Follow Up'] = addDays(1);
  const note = $('#note').value.trim();
  if (note) up.Notes = stamp() + ' — ' + note + (l.d.Notes ? '\n' + l.d.Notes : '');
  if (o.mode === 'call') {
    up.Attempts = String((+l.d.Attempts || 0) + 1); up['Last Called'] = stamp();
    if (!l.d['First Called']) up['First Called'] = new Date().toISOString();
    if (!note) up.Notes = stamp() + ' — Call ' + up.Attempts + ': ' + o.status + (l.d.Notes ? '\n' + l.d.Notes : '');
  }
  const row = o.row; closeSheet(); saveLead(row, up);
}

/* ---------- voice note (falls back to the keyboard mic) ---------- */
let rec = null;
function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} rec = null; } const m = $('#mic'); if (m) m.classList.remove('rec'); }
function dictate() {
  const ta = $('#note'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const fallback = () => { stopMic(); ta.focus(); toast('Tap the mic on your keyboard to speak'); };
  if (rec) return stopMic();
  if (!SR) return fallback();
  try {
    rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false; rec.continuous = false;
    rec.onresult = e => { const t = Array.from(e.results).map(r => r[0].transcript).join(' '); ta.value = (ta.value ? ta.value + ' ' : '') + t; };
    rec.onerror = fallback; rec.onend = () => { rec = null; const m = $('#mic'); if (m) m.classList.remove('rec'); };
    rec.start(); $('#mic').classList.add('rec'); toast('Listening… tap again to stop');
  } catch (e) { fallback(); }
}

/* ---------- calls: popup opens when you come back to the app ---------- */
function markCall(row) {
  S.pending = { row, t: Date.now(), hid: false };
  setTimeout(() => { if (S.pending && S.pending.row === row && !S.pending.hid && document.visibilityState === 'visible') resolveCall(); }, 2500);
}
function resolveCall() { if (!S.pending) return; const p = S.pending; S.pending = null; openSheet(p.row, 'call', p.hid ? (Date.now() - p.t) / 1000 : 0); }
document.addEventListener('visibilitychange', () => {
  if (!S.pending) return;
  if (document.visibilityState === 'hidden') S.pending.hid = true;
  else setTimeout(resolveCall, 350);
});

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const call = e.target.closest('[data-call]'); if (call) { if (S.sheet) closeSheet(); markCall(+call.dataset.call); return; }
  if (e.target.closest('[data-wa]')) return;
  if (e.target.closest('select,input,textarea,label.fu')) return;
  const f = e.target.closest('[data-f]'); if (f) { S.filter = f.dataset.f; S.q = ''; $('#q').value = ''; renderLeads(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const nav = e.target.closest('[data-v]'); if (nav) { S.view = nav.dataset.v; document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== S.view); document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b === nav)); render(); window.scrollTo(0, 0); return; }
  const p = e.target.closest('[data-p]'); if (p) { S.period = p.dataset.p; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === p)); renderStats(); return; }
  if (e.target.closest('[data-back]')) { closeDetail(); return; }
  const nt = e.target.closest('[data-note]'); if (nt) { openSheet(+nt.dataset.note, 'note'); return; }
  const op = e.target.closest('[data-open]'); if (op) { openDetail(+op.dataset.open); return; }
  const cd = e.target.closest('.card'); if (cd && !e.target.closest('.sheet')) { openDetail(+cd.dataset.row); return; }
});
$('#sheet').addEventListener('click', e => {
  const s = e.target.closest('[data-s]');
  if (s) { S.sheet.status = s.dataset.s; $('#sheet').querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === s)); if (s.dataset.s === 'Follow-up' && !S.sheet.fu) { S.sheet.fu = addDays(1); renderQD(); } return; }
  const d = e.target.closest('[data-d]'); if (d) { S.sheet.fu = S.sheet.fu === d.dataset.d ? '' : d.dataset.d; renderQD(); return; }
  if (e.target.closest('#mic')) { dictate(); return; }
  if (e.target.id === 'save') saveSheet();
});
$('#sheet').addEventListener('change', e => { if (e.target.id === 'fuPick') { S.sheet.fu = e.target.value; renderQD(); } });
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-st]');
  if (sel) { const row = +sel.dataset.st, l = S.leads.find(x => x.row === row); const up = { Status: sel.value }; if (sel.value === 'Follow-up' && !l.d['Follow Up']) up['Follow Up'] = addDays(1); saveLead(row, up, sel.value + ' ✓'); return; }
  const fu = e.target.closest('[data-fu]'); if (fu) saveLead(+fu.dataset.fu, { 'Follow Up': fu.value }, fu.value ? 'Follow up ' + fmtDay(fu.value) : 'Follow-up cleared');
});
$('#ov').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.detail != null) closeDetail(); } });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderLeads(); });
$('#client').addEventListener('change', e => { S.client = e.target.value; lsSet('client', S.client); S.filter = 'today'; load(); });
$('#refresh').addEventListener('click', () => load(true));
setInterval(() => { if (document.visibilityState === 'visible' && !S.sheet) load(true); }, 60000);

/* ---------- demo data (used only outside Google) ---------- */
const DEMO = (() => {
  const iso = h => new Date(Date.now() - h * 3600e3).toISOString().slice(0, 19) + '+0000';
  const hrsToday = Math.max(1, new Date().getHours() + new Date().getMinutes() / 60);
  const names = ['Riya Suresh', 'Joel Mathew', 'Ameena Basheer', 'Nikhil Varghese', 'Divya Krishnan', 'Mohammed Ali', 'Sneha Thomas', 'Vishnu Prasad', 'Ayesha Khan', 'Rahul Nair', 'Fathima Rasheed', 'Arjun Menon'];
  const hrs = [0.6, hrsToday * .35, hrsToday * .6, hrsToday * .85, hrsToday + 3, hrsToday + 6, hrsToday + 20, hrsToday + 27, hrsToday + 40, hrsToday + 50, hrsToday + 70, hrsToday + 96];
  const cities = ['Aluva', 'Kozhikode', 'Kakkanad', 'Kochi', 'Edappally', 'Thrissur'];
  const t = today(), tm = addDays(1), y = addDays(-1);
  const st = [['', '', '', ''], ['Interested', addDays(3), '1', 'Family of 4, wants 2BHK furnished. Moving in January.'], ['Follow-up', t, '1', 'Asked to call back after 6 pm'], ['', '', '', ''],
    ['No answer', tm, '1', 'Call 1: No answer'], ['Visit booked', addDays(2), '2', 'Visiting Saturday 11 am'], ['Rented', '', '3', 'Signed 11-month agreement'], ['No answer', y, '2', 'Call 2: No answer'],
    ['Not interested', '', '1', 'Budget too low'], ['Wrong number', '', '1', ''], ['Interested', y, '1', 'Comparing with another flat nearby'], ['', '', '', '']];
  const rows = names.map((n, i) => { const [s, fu, att, note] = st[i];
    const fc = att ? new Date(Date.now() - (hrs[i] - [0, .3, .9, 0, .2, 2, 1, 3, .1, .5, 4, 0][i]) * 3600e3).toISOString() : '';
    // Same columns the backend sends for the real Ibna sheet (Meta's ad/form columns are dropped in Code.gs).
    return { id: 'l:' + (9000 + i * 7), created_time: iso(hrs[i]), campaign_name: 'IBNA BUILDERS - 14 oct-2026',
      'which_type_of_apartment_you_are_looking_for?': i % 3 === 2 ? 'unfurnished' : 'furnished',
      full_name: n, phone_number: 'p:+9198' + String(46012345 + i * 1931).slice(0, 8), city: cities[i % cities.length],
      Status: s, Notes: note ? (fmtDT(fc || iso(hrs[i] - .5)) + ' — ' + note) : '', 'Follow Up': fu, Attempts: att, 'Last Called': '', 'First Called': fc }; });
  const db = { 'Ibna': rows };
  return {
    getClients: () => Object.keys(db),
    getLeads: tab => ({ headers: Object.keys(db[tab][0]), leads: db[tab].map((d, i) => ({ row: i + 2, d: { ...d } })) }),
    updateLead: (tab, row, up) => { Object.assign(db[tab][row - 2], up); return true; }
  };
})();

init();
}
</script>
